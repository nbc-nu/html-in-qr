<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
<script>
    const params = new URLSearchParams(window.location.search);
    let base64Code = params.get('c');

    if (base64Code) {
        try {

            base64Code = base64Code.padEnd(base64Code.length + (4 - base64Code.length % 4) % 4, '=');
            
            const rawData = window.atob(base64Code.replace(/-/g, '+').replace(/_/g, '/'));
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            
            // Decodifica usando o padrão universal UTF-8
            const decodedHtml = new TextDecoder('utf-8').decode(outputArray);

            document.open();
            document.write(decodedHtml);
            document.close();
        } catch (e) {
            try {
                const rawData = window.atob(base64Code);
                document.open();
                document.write(rawData);
                document.close();
            } catch (err2) {
                document.body.innerHTML = "<h3>OPS! something went wrong :(</h3>";
            }
        }
    }
</script>
</body>
</html>
