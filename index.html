<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
<script>
    const urlStr = window.location.href;
    const match = urlStr.match(/[?&]c=([^&]+)/);
    
    if (match && match[1]) {
        try {
            let base64Code = match[1];
            
            base64Code = base64Code.replace(/[^A-Za-z0-9+/=_-]/g, '');
            base64Code = base64Code.padEnd(base64Code.length + (4 - base64Code.length % 4) % 4, '=');
            

            const binaryString = window.atob(base64Code.replace(/-/g, '+').replace(/_/g, '/'));
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            const decodedHtml = new TextDecoder('utf-8').decode(bytes);


            document.open();
            document.write(decodedHtml);
            document.close();
        } catch (e) {
            document.body.innerHTML = "<h1>!!BUGBOOT!!</h1><br><pre>certify if is realy base64 or if is raw base64. <br> if this is an bug please contact us</pre>";
        }
    } else {
        document.body.innerHTML = "<h2>This HTML-IN-QR do not have an code to run!!</h2><pre> O: please put an code</pre>";
    }
</script>
</body>
</html>
