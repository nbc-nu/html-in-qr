<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
<script>
    const params = new URLSearchParams(window.location.search);
    const base64Code = params.get('c');

    if (base64Code) {
        try {
            const decodedHtml = decodeURIComponent(atob(base64Code).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            
            document.open();
            document.write(decodedHtml);
            document.close();
        } catch (e) {
            console.error("error on parameter:", e);
        }
    }
</script>
</body>
</html>
